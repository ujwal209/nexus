services:
  - type: web
    name: nexus-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    rootDir: practice1/backend
    envVars:
      - key: DATABASE_NAME
        value: nexus
      - key: MONGODB_URI
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      - key: TAVILY_API_KEYS
        sync: false
